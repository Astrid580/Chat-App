{% extends 'base.html' %}

{% block content %}

<div class="container" style="display: flex; flex-direction: column; align-items: center; padding-top: 50px;">
    <h1>Welcome</h1>

    {% if error %}
    <div class="error-msg">
        ⚠️ {{ error }}
    </div>
    {% endif %}
    <form id="auth-form" action="{{url_for('login')}}" method="post" class="buttons" style="background-color: #18365c; padding: 20px; border-radius: 10px; border: 2px solid black;">
        <input type="text" name="username" placeholder="username" class="input-field" style="padding: 10px; width: 250px; border-radius: 5px; border: none; margin-bottom: 10px;" required />
        <input type="password" name="password" placeholder="password" class="input-field" style="padding: 10px; width: 250px; border-radius: 5px; border: none; margin-bottom: 10px;" required />

        <div style="display: flex; gap: 10px; width: 100%;">
            <input type="submit" value="Login" class="btn btn-login" onclick="setActionForm('login')" style="flex: 1; padding: 10px; cursor: pointer; background-color: #224476; color: white; border: 1px solid white; border-radius: 5px;" />
            <input type="button" value="Register" class="btn btn-login" onclick="setActionForm('register')" style="flex: 1; padding: 10px; cursor: pointer; background-color: #4CAF50; color: white; border: 1px solid white; border-radius: 5px;" />
        </div>
    </form>
</div>

<script>
    function setActionForm(action) {
        let form = document.getElementById("auth-form");
        if (action === 'login') {
            form.action = "{{url_for('login')}}";
            form.method = 'post';
            form.submit();
        } else if (action === "register") {
            form.action = "{{url_for('register')}}";
            form.method = 'post';
            form.submit();
        }
    }
</script>

{% endblock %}
